name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12 # keep in lockstep with the Dockerfile's BUN_VERSION
      - run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      # Several modules prepare statements against the DB at import time (same
      # as production, which migrates before start) — give tests a real schema.
      - name: Migrate test DB
        run: bun run db:migrate
      - name: Tests
        run: bun test tests/
